name: PRADO MongoDB Extension
on:
  push:
  pull_request:
  schedule:
    # The extension tracks PRADO's prado-4.3 and master branches, so a change there can break a
    # build that no commit here triggered. Once a week catches that.
    - cron: '41 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composerext:
    name: PRADO ${{ matrix.prado }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One code base for both lines. PRADO 4.3.3 supports PHP 8.1+, PRADO 4.4.0 PHP 8.2+.
        include:
          - { prado: '4.3.3', ref: prado-4.3, php: '8.1' }
          - { prado: '4.3.3', ref: prado-4.3, php: '8.3' }
          - { prado: '4.4.0', ref: master, php: '8.2' }
          - { prado: '4.4.0', ref: master, php: '8.4' }

    defaults:
      run:
        working-directory: prado-mongodb

    steps:
      - name: Checkout extension
        uses: actions/checkout@v7
        with:
          path: prado-mongodb

      # composer.json resolves pradosoft/prado from the sibling directory ../prado.
      - name: Checkout PRADO framework (${{ matrix.ref }})
        uses: actions/checkout@v7
        with:
          repository: pradosoft/prado
          ref: ${{ matrix.ref }}
          path: prado

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, intl, json, mbstring, mongodb, openssl, pcre, spl, zlib
          tools: php-cs-fixer, phpstan, cs2pr

      - name: Validate composer.json
        run: composer validate --strict

      - name: Validate code syntax using php-cs-fixer
        run: php-cs-fixer fix -vvv --dry-run --using-cache=no --format=checkstyle | cs2pr

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-prado${{ matrix.prado }}-composer-${{ hashFiles('prado-mongodb/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-prado${{ matrix.prado }}-composer-

      # PRADO 4.3.3 has ActiveRecord built in. PRADO 4.4 ships it as the separate, optional package
      # pradosoft/prado-activerecord, which is for 4.4 only, so it is added for that line alone.
      - name: Add the ActiveRecord package (PRADO 4.4 only)
        if: matrix.ref == 'master'
        run: composer require --dev --no-update "pradosoft/prado-activerecord:dev-main"

      - name: Install Composer dependencies
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: Validate code using phpstan
        run: phpstan analyse --memory-limit=512M --error-format=checkstyle | cs2pr

      # Multi-document transactions need a replica set, and a service container cannot take the
      # --replSet argument, so MongoDB runs as a single-node replica set started here. Its image
      # ships mongosh, so the schema script runs inside the container.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongodb mongosh --quiet --eval 'db.runCommand({ping:1})' > /dev/null 2>&1 && break; sleep 2; done
          docker exec mongodb mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for i in $(seq 1 30); do [ "$(docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 2; done
          docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true

      - name: Setup MongoDB schema
        run: |
          docker cp tests/initdb_mongodb.js mongodb:/tmp/initdb_mongodb.js
          docker exec mongodb mongosh "mongodb://localhost:27017/prado_unitest" --quiet /tmp/initdb_mongodb.js

      # A test that cannot run here skips itself; on this runner every prerequisite is installed, so
      # a skip means a test stopped running. The step fails on it.
      - name: Run Unit Tests
        run: |
          set -o pipefail
          composer unittest | tee unit.log
          if grep -q 'Skipped:' unit.log; then echo "::error::Unit tests were skipped."; exit 1; fi
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: prado_unitest
